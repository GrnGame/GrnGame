name: tests

on:
  workflow_call:

jobs:
  auto-tests:
    runs-on: ubuntu-22.04
    name: "auto tests / linux-x64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build for tests
        uses: actions/download-artifact@v4
        with:
          name: tests-build-linux-x64
          path: ${{ runner.temp }}/tests-artifact

      # tar restores original timestamps, so nothing gets rebuilt
      - name: Extract build
        run: >
          tar -xzf "$RUNNER_TEMP/tests-artifact/tests-build-linux-x64.tar.gz"
          -C "$GITHUB_WORKSPACE"

      - name: Setup Virtual Display
        run: |
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libgles2 mesa-vulkan-drivers

      - name: Run auto tests
        env:
          SDL_AUDIODRIVER: dummy
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          MESA_GL_VERSION_OVERRIDE: "4.5"
          MESA_GLSL_VERSION_OVERRIDE: "450"
        run: >
          xvfb-run -a -s "-screen 0 1280x720x24"
          cmake --build build --config Release --target auto_tests -- -j 3