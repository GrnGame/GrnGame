name: Release

on:
  workflow_call:

jobs:
  # first prepare every releases assets (zip)
  prepare_assets:
    name: Prepare staging folders and zips
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Package zips and build staging
        run: python3 scripts/release/package_release.py "${{ github.ref_name }}"

      - name: Upload zips
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: release-assets/*.zip

      - name: Upload staging folders
        uses: actions/upload-artifact@v4
        with:
          name: staging-folders
          path: staging_*/**

  # create xpack and upload it
  build_pack:
    name: Pack ${{ matrix.platform }}
    needs: prepare_assets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
          - platform: windows-arm64
            os: windows-11-arm
          - platform: linux-x64
            os: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Staging Folders
        uses: actions/download-artifact@v4
        with:
          name: staging-folders

      - name: Install Linux Packaging Tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      #wix not here on arm
      - name: Install WiX Toolset (v3)
        if: runner.os == 'Windows'
        run: |
          choco install wixtoolset -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\WiX Toolset v3.14\bin"

      - name: Check WiX
        if: runner.os == 'Windows'
        run: where.exe candle

      - name: Run Pack script
        run: python scripts/release/build_pack.py "${{ github.ref_name }}"

      - name: Upload Native Packages
        uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.platform }}
          path: release-assets/*

  # merge and push
  release:
    name: Create GitHub Release
    needs: build_pack
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Zips
        uses: actions/download-artifact@v4
        with:
          name: release-zips
          path: release-assets/

      - name: Download Native Packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets/
          pattern: pack-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release-assets/*