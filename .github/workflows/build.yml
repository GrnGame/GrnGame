name: Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*.*.*" ]
  pull_request:

jobs:
  format:
    name: Format check
    uses: ./.github/workflows/format.yml

  build:
    name: level1
    uses: ./.github/workflows/build-desktop.yml

  build-web:
    name: level1
    uses: ./.github/workflows/build-web.yml

  build-android:
    name: level1
    uses: ./.github/workflows/build-android.yml

  build-ios:
    name: level1
    uses: ./.github/workflows/build-ios.yml

  tests:
    name: level2
    permissions:
      contents: write
    needs: [ build ]
    uses: ./.github/workflows/tests.yml

  dynamic:
    name: level2
    needs: [ build ]
    uses: ./.github/workflows/dynamic-libs.yml

  release:
    name: level3
    needs: [ build, build-web, build-android, build-ios, dynamic, tests ]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml