name: Build android

on:
  workflow_call:

jobs:
  build-android:
    strategy:
      fail-fast: false
      matrix:
        abi: [ arm64-v8a, x86_64 ]

    runs-on: ubuntu-latest
    name: "android-${{ matrix.abi }} / release"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: .cmake-cache/cpm
          key: cmake-cpm-android-${{ matrix.abi }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}

      #ndk is already installed use version 33
      - name: Configure
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cmake-cache/cpm
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=${{ matrix.abi }}
          -DANDROID_PLATFORM=android-33
          -DCMAKE_BUILD_TYPE=Release
          -DGRNGAME_EMBED_ASSETS=ON

      - name: Build
        run: cmake --build build --config Release --target Runtime --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "runtime-android-${{ matrix.abi }}"
          path: build/runtime/release/libGrnGame.so
          if-no-files-found: error