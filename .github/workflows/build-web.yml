name: Build web

on:
  workflow_call:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    name: "wasm / release"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: .cmake-cache/cpm
          key: cmake-cpm-wasm-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}

      - name: Configure
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cmake-cache/cpm
        run: >
          emcmake cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DGRNGAME_EMBED_ASSETS=ON
          -DGRNGAME_WASM_THREADS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "runtime-wasm"
          path: build/runtime/release/