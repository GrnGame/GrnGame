name: Build desktop

on:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, runner: ubuntu-22.04, platform: linux-x64, buildtype: Release, embed: false }
          - { os: ubuntu-22.04, runner: ubuntu-22.04, platform: linux-x64, buildtype: Release, embed: true }
          - { os: ubuntu-22.04-arm, runner: ubuntu-22.04-arm, platform: linux-arm64, buildtype: Release, embed: false }
          - { os: ubuntu-22.04-arm, runner: ubuntu-22.04-arm, platform: linux-arm64, buildtype: Release, embed: true }
          - { os: macos-15, runner: macos-15, platform: macos-arm64, buildtype: Release, embed: false }
          - { os: macos-15, runner: macos-15, platform: macos-arm64, buildtype: Release, embed: true }
          - { os: macos-15-intel, runner: macos-15-intel, platform: macos-x64, buildtype: Release, embed: false }
          - { os: macos-15-intel, runner: macos-15-intel, platform: macos-x64, buildtype: Release, embed: true }
          - { os: windows-latest, runner: windows-latest, platform: windows-x64, buildtype: Release, embed: false }
          - { os: windows-latest, runner: windows-latest, platform: windows-x64, buildtype: Release, embed: true }
          - { os: windows-11-arm, runner: windows-11-arm, platform: windows-arm64, buildtype: Release, embed: false }
          - { os: windows-11-arm, runner: windows-11-arm, platform: windows-arm64, buildtype: Release, embed: true }

    runs-on: ${{ matrix.runner }}
    name: "${{ matrix.platform }} / ${{ matrix.buildtype }} / embedded = ${{ matrix.embed }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      #sdl dependencies using SDL_X11_XCURSOR OFF going to remove somes fonctionalities
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            make \
            pkg-config \
            cmake \
            ninja-build \
            gnome-desktop-testing \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libfribidi-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libdrm-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libthai-dev \
            libusb-1.0-0-dev

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: .cmake-cache/cpm
          #this is the future if a cmake file change cache is delete
          key: cmake-cpm-${{ matrix.platform }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}

      - name: Configure
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cmake-cache/cpm
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.buildtype }}
          -DGRNGAME_EMBED_ASSETS=${{ matrix.embed }}

      - name: Build
        run: cmake --build build --config ${{ matrix.buildtype }} --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${{ matrix.platform }}-${{ matrix.buildtype }}-embed${{ matrix.embed }}"
          path: |
            build/embedded/release/
            build/runtime/release/