name: Build iOS

on:
  workflow_call:

jobs:
  build-ios:
    strategy:
      fail-fast: false
      matrix:
        arch: [ arm64 ]

    runs-on: macos-15
    name: "ios-${{ matrix.arch }} / release"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: .cmake-cache/cpm
          key: cmake-cpm-ios-${{ matrix.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/*.cmake') }}

      #sdk min version is 26.2
      - name: Select Xcode
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cmake-cache/cpm
        run: >
          cmake -S . -B build
          -G Xcode
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=17.5
          -DCMAKE_BUILD_TYPE=Release
          -DGRNGAME_EMBED_ASSETS=ON
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO


      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: "runtime-ios-${{ matrix.arch }}"
          path: build/runtime/release/
          if-no-files-found: error