<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>GrnGame</title>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;
            outline: none;
        }

        #loader {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 32px;
            background: #000;
            transition: opacity 0.3s;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loader-logo {
            width: 512px;
            height: 512px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;
            animation: pulse 2.0s ease-in-out infinite;
        }


        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }
        }

        #loader-text {
            display: none;
            color: rgb(199, 17, 17);
            font-family: monospace;
            text-align: center;
            padding: 0 16px;
        }

        #loader.error #loader-text {
            display: block;
        }
    </style>
</head>

<body>
    <!-- lock right click -->
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>

    <div id="loader">
        <img id="loader-logo" src="logo.png" alt="">
        <div id="loader-text"></div>
    </div>

    <script>
        var loader = document.getElementById("loader");
        var loaderText = document.getElementById("loader-text");

        function showLoaderError(message) {
            loader.classList.remove("hidden");
            loader.classList.add("error");
            loaderText.textContent = message;
        }

        function preloadFile(name) {
            var dep = "preload " + name;
            addRunDependency(dep);

            fetch(name)
                .then(function (response) {
                    if (!response.ok)
                        throw new Error("HTTP " + response.status);
                    return response.arrayBuffer();
                })
                .then(function (buffer) {
                    FS.writeFile("/" + name, new Uint8Array(buffer));
                })
                .catch(function (err) {
                    showLoaderError("Failed to load " + name + " (" + err.message + ")");
                })
                .finally(function () {
                    removeRunDependency(dep);
                });
        }

        var Module = {
            canvas: document.getElementById("canvas"),

            preRun: [
                function () {
                    preloadFile("Assets.pak");
                    preloadFile("metadata.json");
                }
            ],

            postRun: [
                function () {
                    loader.classList.add("hidden");
                    Module.canvas.focus();
                }
            ],

            onAbort: function (what) {
                showLoaderError("error: " + what);
            }
        };
    </script>
    <!-- you can change name here if you rename your file  -->
    <script async src="Runtime-wasm-x86-releaseembedded.js"></script>
</body>

</html>
